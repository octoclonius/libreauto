syntax = "proto2";

package io.github.octoclonius.libreauto.protocol.media;

import "io/github/octoclonius/libreauto/protocol/control/discovery.proto";

message MediaSetupRequest {
  optional int32 codec = 1;
}

message MediaSetupResponse {
  optional int32 status = 1;
  optional int32 max_unacked = 2;
  repeated int32 config_indexes = 3;
}

message VideoFocusRequest {
  optional int32 mode = 2;
  optional int32 reason = 3;
}

message VideoFocusNotification {
  optional int32 mode = 1;
  optional bool unsolicited = 2;
}

message MediaStart {
  optional int32 session = 1;
  optional int32 config_index = 2;
}

message MediaAck {
  optional int32 session = 1;
  optional int32 count = 2;
}

message MicrophoneRequest {
  optional bool is_open = 1;
  optional bool noise_suppression = 2;
  optional bool echo_cancellation = 3;
  optional int32 max_unacked = 4;
}

message MicrophoneResponse {
  optional int32 status = 1;
  optional int32 session = 2;
}

message UiConfigUpdate {
  optional io.github.octoclonius.libreauto.protocol.control.UiConfig config = 1;
}
